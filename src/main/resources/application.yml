spring:
  profiles:
    default: mysql
  application:
    name: OdontoPoint Web
  datasource:
    url: ${ODONTO_DB_URL:jdbc:h2:file:./datos-web/odontopoint;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${ODONTO_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  thymeleaf:
    cache: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
logging:
  file:
    name: logs/odontopoint-web.log
